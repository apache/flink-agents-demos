# Flink configuration for the AGENT cluster (the cluster that runs the
# operations agent). The monitored "target" cluster runs in Docker.

env:
  java:
    opts:
      all: --add-exports=java.base/sun.net.util=ALL-UNNAMED --add-exports=java.rmi/sun.rmi.registry=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-exports=java.security.jgss/sun.security.krb5=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.text=ALL-UNNAMED --add-opens=java.base/java.time=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED --add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED --add-opens=java.base/java.util.concurrent.locks=ALL-UNNAMED

jobmanager:
  bind-host: localhost
  rpc:
    address: localhost
    port: 6123
  memory:
    process:
      size: 1600m
  execution:
    failover-strategy: region

# Two TaskManagers with 4 slots each: the agent runs at parallelism 4, so
# killing one TaskManager still leaves enough slots to fail over.
taskmanager:
  bind-host: localhost
  host: localhost
  numberOfTaskSlots: 4
  memory:
    process:
      size: 2048m

parallelism:
  default: 4

# Notice a killed TaskManager within seconds (the demo's crash scene).
heartbeat:
  interval: 2000
  timeout: 10000

rest:
  address: localhost
  bind-address: localhost
  port: 8082

web:
  submit:
    enable: true
  cancel:
    enable: true

# Agent memory (short-term memory) is Flink keyed state, so it is
# checkpointed together with the stream position.
state:
  backend:
    type: hashmap

execution:
  checkpointing:
    interval: 10s
    dir: file://CHECKPOINT_DIR_PLACEHOLDER
    savepoint-dir: file://SAVEPOINT_DIR_PLACEHOLDER
    externalized-checkpoint-retention: RETAIN_ON_CANCELLATION

restart-strategy:
  type: fixed-delay
  fixed-delay:
    attempts: 100
    delay: 5s

# pemja: `flink run -py` also ships opt/flink-python as a user jar. Without this,
# every job restart loads pemja (and libpython) in a fresh user classloader and
# fails with "Native Library ... already loaded in another classloader", i.e.
# the agent job could never fail over.
classloader.parent-first-patterns.additional: jakarta.json;org.eclipse.parsson;pemja

# Python workers use the module's venv regardless of the shell that started
# the TaskManagers.
python:
  executable: PYTHON_EXECUTABLE_PLACEHOLDER
  client:
    executable: PYTHON_EXECUTABLE_PLACEHOLDER

agent:
  # Durable execution: completed actions / durable_execute results are
  # recorded in Kafka, so recovery never repeats an LLM call or a side effect.
  actionStateStoreBackend: kafka
  kafkaBootstrapServers: localhost:9092
  kafkaActionStateTopic: agent_action_state
  kafkaActionStateTopicNumPartitions: 8
  # Stable identity across restarts/resubmissions of the agent job.
  job-identifier: stateful-ops-agent
  # A slow or failing LLM call is retried instead of failing the job.
  error-handling-strategy: retry
  max-retries: 3
  retry-wait-interval: 5
  # Event log as audit trail (SLF4J -> visible in the Flink UI "Logs" tab).
  eventLoggerType: slf4j
  event-log.level: STANDARD
